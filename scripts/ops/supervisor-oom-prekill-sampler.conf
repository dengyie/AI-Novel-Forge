[program:oom-prekill-sampler]
command=/personal/pxed/oom-prekill-sampler.sh
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
stdout_logfile=/personal/pxed/oom-prekill-sampler.supervisor.log
stderr_logfile=/personal/pxed/oom-prekill-sampler.supervisor.err.log
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 反代 api 容器；SSE 必须关缓冲并放宽超时，否则流式生成与长连会断
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 20m;

        # Match Express upload routes; reject known oversize bodies before buffering.
        # Inherit proxy/SSE headers and timeouts; other APIs retain the 20m limit.
        location ~* ^/api/comic/(character-assets|scenes)/[^/]+/upload-image/?$ {
            proxy_pass http://api:3000;
            client_max_body_size 10m;
            error_page 413 = @image_upload_too_large;
        }
    }

    location @image_upload_too_large {
        default_type application/json;
        return 413 '{"success":false,"error":"图片不能超过 10 MiB，请压缩后重试。"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
